name: Build Textbook and Slide PDFs

on:
  push:
    branches:
      - master
    tags:
      - '*'
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  discover:
    name: Discover PDF sources
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.sources.outputs.matrix }}
      count: ${{ steps.sources.outputs.count }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Discover configured sources
        id: sources
        run: python3 .github/scripts/discover-pdfs.py

  build:
    name: Build ${{ matrix.target }}/${{ matrix.source }}
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build PDF
        env:
          PDF_SOURCE: ${{ matrix.source }}
          PDF_TARGET: ${{ matrix.target }}
        run: |
          docker build \
            --file docker/text.Dockerfile \
            --target final \
            --build-arg "TARGET=${PDF_TARGET}/" \
            --build-arg "SOURCE=${PDF_SOURCE}" \
            --output type=local,dest=./artifact \
            .
      - name: Verify PDF output
        env:
          EXPECTED_PDF: ${{ matrix.pdf }}
        run: |
          mapfile -t pdfs < <(find ./artifact -maxdepth 1 -type f -name '*.pdf' -printf '%f\n' | sort)
          if (( ${#pdfs[@]} != 1 )) || [[ "${pdfs[0]:-}" != "${EXPECTED_PDF}" ]]; then
            printf '::error::Expected only %s, found: %s\n' "${EXPECTED_PDF}" "${pdfs[*]:-(none)}"
            exit 1
          fi
      - name: Upload PDF
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: ./artifact/${{ matrix.pdf }}
          archive: false
          if-no-files-found: error

  publish:
    name: Publish PDFs to GitHub Release
    if: startsWith(github.ref, 'refs/tags/') && !startsWith(github.ref_name, 'buildenv-')
    needs:
      - discover
      - build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download direct PDF artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: '*.pdf'
          path: release-assets
          merge-multiple: true
      - name: Create or update release
        env:
          EXPECTED_COUNT: ${{ needs.discover.outputs.count }}
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          shopt -s nullglob
          pdfs=(release-assets/*.pdf)
          if (( ${#pdfs[@]} != EXPECTED_COUNT )); then
            printf '::error::Expected %s PDFs, downloaded %s.\n' "${EXPECTED_COUNT}" "${#pdfs[@]}"
            exit 1
          fi

          if ! gh release view "${TAG_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release create "${TAG_NAME}" \
              --repo "${GITHUB_REPOSITORY}" \
              --verify-tag \
              --title "${TAG_NAME}" \
              --generate-notes
          fi
          gh release upload "${TAG_NAME}" "${pdfs[@]}" \
            --repo "${GITHUB_REPOSITORY}" \
            --clobber
