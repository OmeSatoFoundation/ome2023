name: Build Indivisual Chapter PDFs

on:
  push:
    tags:
      - "*"
      - "buildenv-**"
    branches:
      - "workflow-dev"

env:
  REGISTRY: ghcr.io
jobs:
  build-and-push:
    env:
      IMAGE_NAME: texlive
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        chapter: ['01', '02', '03', '04', '05', '06', '07', '08']
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: "false"
    - name: Rewrite GitHub SSH URLs to HTTPS for CI
      run: |
        git config --global --add url."https://github.com/".insteadOf "git@github.com:"
        git config --global --add url."https://github.com/".insteadOf "ssh://git@github.com/"
    - name: Initialize submodules
      run: |
        git submodule sync --recursive
        git submodule update --init --recursive
    - name: Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Create the GitHub Repository Name with All Small Cases
      run: |
        echo "REPOSITORY_NAME_LC=${REPOSITORY_NAME,,}" >>"${GITHUB_ENV}"
      env:
        REPOSITORY_NAME: '${{ github.repository }}'
    - name: Build Chapter ${{ matrix.chapter }}
      uses: docker/build-push-action@v5
      with:
        context: .
        push: false
        target: "final"
        outputs: "type=local,dest=./artifact/${{matrix.chapter }}"
        file: "./docker/text.Dockerfile"
        build-args: |
          TARGET=${{ matrix.chapter }}/textbook/
    - name: Upload Chapter ${{ matrix.chapter }}
      uses: actions/upload-artifact@v6
      with:
        name: "itmtext${{ matrix.chapter }}"
        path: "./artifact/${{ matrix.chapter }}/text${{ matrix.chapter }}.pdf"

